<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UniTEAM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23107c41'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EW%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Kütüphaneler artık CDN'den değil, npm'den gelir ve Vite tek pakete derler
       (src/vendor.js). Böylece sürüm sabit, çevrimdışı çalışır, internet gerekmez. -->
</head>
<body data-mode="xlsx">
  <a href="#workarea" id="skip-link" data-i18n="İçeriğe geç|Skip to content">İçeriğe geç</a>
  <!-- ÜST ÇUBUK: ortak dosya işlemleri -->
  <header id="topbar" role="banner">
    <div class="brand"><span id="mode-icon">📊</span> <span id="mode-name">Excel</span></div>
    <div id="doc-title"></div>
    <div class="top-actions" role="toolbar" data-i18n-aria="Dosya ve hesap araçları|File and account tools" aria-label="Dosya ve hesap araçları">
      <button id="btn-lang" data-i18n-aria="Dil seçimi|Language selection" aria-label="Dil" aria-haspopup="menu" title="Dil">🌐 TR</button>
      <button id="btn-theme" data-i18n-title="Görünümü özelleştir (renk)|Customize appearance (color)" data-i18n-aria="Görünümü özelleştir|Customize appearance" aria-label="Görünümü özelleştir" title="Görünümü özelleştir (renk)">🎨</button>
      <button id="btn-open" data-i18n="📂 Aç|📂 Open" data-i18n-title="Dosya aç (.xlsx .csv .docx .pptx)|Open file (.xlsx .csv .docx .pptx)" title="Dosya aç (.xlsx .csv .docx .pptx)">📂 Aç</button>
      <button id="btn-download" data-i18n="⬇ İndir|⬇ Download" data-i18n-title="Bir kopyasını bilgisayara indir|Download a copy to your computer" title="Bir kopyasını bilgisayara indir">⬇ İndir</button>
      <button id="btn-save" data-i18n="💾 Kaydet|💾 Save" data-i18n-title="Kaydet — dosyanın üstüne yaz (Ctrl+S) · Farklı Kaydet (Ctrl+Shift+S)|Save — overwrite file (Ctrl+S) · Save As (Ctrl+Shift+S)" title="Kaydet — dosyanın üstüne yaz (Ctrl+S)">💾 Kaydet</button>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.docx,.pptx" hidden />
      <button id="btn-live" data-i18n="🟢 Canlı|🟢 Live" data-i18n-title="Canlı ortak düzenleme (Word, PowerPoint, Excel)|Live co-editing (Word, PowerPoint, Excel)" title="Canlı ortak düzenleme (Word, PowerPoint, Excel)">🟢 Canlı</button>
      <button id="btn-comments" data-i18n-title="Yorumlar|Comments" data-i18n-aria="Yorumlar|Comments" aria-label="Yorumlar" title="Yorumlar">💬</button>
      <button id="btn-notif" class="hidden" data-i18n-title="Bildirimler|Notifications" data-i18n-aria="Bildirimler|Notifications" aria-label="Bildirimler" title="Bildirimler">🔔</button>
      <button id="btn-help" data-i18n-title="Yardım ve şablonlar|Help and templates" data-i18n-aria="Yardım|Help" aria-label="Yardım" title="Yardım ve şablonlar">❔</button>
      <button id="btn-account" data-i18n="👤 Giriş|👤 Sign in" data-i18n-title="Giriş yap / Kayıt ol|Sign in / Sign up" title="Giriş yap / Kayıt ol">👤 Giriş</button>
    </div>
  </header>

  <!-- ŞERİT: etkin modun araçları -->
  <nav id="ribbon" role="toolbar" data-i18n-aria="Şerit araç çubuğu|Ribbon toolbar" aria-label="Şerit"></nav>

  <!-- ALT ÇUBUK: Excel'de formül çubuğu -->
  <div id="subbar"></div>

  <!-- ÇALIŞMA ALANI: etkin modun içeriği -->
  <main id="workarea" tabindex="-1"></main>

  <!-- BELGE ÇUBUĞU: ＋ menüsü ve belge sekmeleri -->
  <footer id="docbar">
    <div id="new-wrap">
      <button id="btn-new" title="Yeni belge ekle">＋</button>
      <div id="new-menu" class="hidden">
        <button data-new="xlsx"><span class="ic x">📊</span> <span data-i18n="Excel Çalışma Kitabı|Excel Workbook">Excel Çalışma Kitabı</span> <small>.xlsx</small></button>
        <button data-new="docx"><span class="ic w">📄</span> <span data-i18n="Word Belgesi|Word Document">Word Belgesi</span> <small>.docx</small></button>
        <button data-new="pptx"><span class="ic p">📙</span> <span data-i18n="PowerPoint Sunusu|PowerPoint Presentation">PowerPoint Sunusu</span> <small>.pptx</small></button>
      </div>
    </div>
    <div id="doctabs"></div>
    <div id="status"></div>
  </footer>

  <!-- Grafik / Pivot / iletişim paneli -->
  <div id="panel" class="hidden" role="dialog" aria-labelledby="panel-title">
    <div class="panel-head">
      <span id="panel-title">Panel</span>
      <button id="panel-close" data-i18n-aria="Paneli kapat|Close panel" aria-label="Kapat">✕</button>
    </div>
    <div id="panel-body"></div>
  </div>

  <!-- Tek giriş noktası — Vite tüm modülleri (vendor + js/*) buradan derler.
       Yükleme sırası src/main.js içinde yönetilir. -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
